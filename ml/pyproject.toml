[project]
name = "smart-ticketing-ml"
version = "0.1.0"
description = "Module IA (Epic 4) — génération de corpus, embeddings, classification, RAG, évaluation."
requires-python = ">=3.10"
dependencies = [
    "ollama>=0.4",            # client LLM local (zéro coût API)
    "psycopg[binary]>=3.1",   # lecture read-only des catégories en base
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Installés au fil des jalons ultérieurs (J3+). Gardés séparés pour que J1 reste léger.
ml = [
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "openpyxl>=3.1",         # lecture de la feuille de relecture du gold set (J2)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["smart_ticketing_ml", "smart_ticketing_ml.data"]

# =============================================================================
#  Intégration continue — rejoue les tests à chaque modification proposée à main.
#
#  Trois jobs indépendants, aucun ne demande de base de données, de modèle lourd
#  ni de build Docker :
#    - backend  : typage, lint et tests unitaires (node:test, fonctions pures) ;
#    - ml       : suite rapide pytest (`-m "not slow"`), 100 % hors ligne ;
#    - frontend : lint, typage et build, plus les deux garde-fous du mode sombre
#                 (aucune couleur réservée au thème clair, contrastes des deux thèmes).
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Un nouveau push sur la même branche annule le passage devenu obsolète.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typage, lint, tests)
    # Image figée : `ubuntu-latest` bascule vers Ubuntu 26 à partir du 19/10/2026, et
    # un changement d'image ne doit pas pouvoir casser la CI sans changement de code.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    # Valeurs FACTICES : aucun test n'ouvre de connexion. Elles existent parce que
    # `config/env.ts` valide l'environnement au chargement, et que le test de
    # rétention importe `audit.service`, qui le charge.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      JWT_SECRET: ci-factice-aucun-secret-ci-factice-aucun-secret
    steps:
      - uses: actions/checkout@v5

      # Node 22 : le script `test` passe un motif glob à `node --test`, que Node ne
      # développe lui-même qu'à partir de la version 21.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Le client Prisma est généré, pas versionné : sans lui, ni le typage ni le
      # test de rétention ne trouvent `src/generated`.
      - run: npx prisma generate

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  ml:
    name: Module IA (pytest, suite rapide)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ml
    env:
      PYTHONPATH: .
      # Garde-fou : un test qui tenterait de télécharger un modèle échoue au lieu
      # de rapatrier silencieusement plusieurs gigaoctets.
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v5

      # Python 3.12 : la version de l'image du service, sur laquelle le lock a été résolu.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.lock

      # Le lock porte lui-même l'index PyTorch CPU : pas de roues CUDA.
      - run: pip install -r requirements.lock

      - run: python -m pytest -m "not slow" -p no:cacheprovider

  frontend:
    name: Frontend (lint, typage, build, couleurs, contrastes)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # `tsc -b` puis `vite build` : le build est la porte la plus stricte du typage.
      - run: npm run build
      # Mode sombre : un écran qui réintroduit une couleur écrite pour le thème clair
      # seulement, ou un couple texte/fond sous 4,5:1 dans l'un des thèmes, fait échouer.
      - run: npm run verifier:couleurs
      - run: npm run verifier:contrastes

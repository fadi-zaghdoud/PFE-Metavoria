server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA : toute route inconnue sert index.html (React Router gère le routing client).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Flux SSE des notifications temps réel : connexion longue, sans buffering,
    # en HTTP/1.1 avec keep-alive amont. Location exacte (prioritaire sur /api/).
    location = /api/notifications/flux {
        proxy_pass http://backend:4000/api/notifications/flux;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Proxifie les appels API vers le service backend du réseau docker-compose.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

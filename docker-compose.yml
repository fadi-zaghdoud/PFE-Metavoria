# =============================================================================
#  Smart Ticketing & Support Assistant — Environnement Docker
#  Usage :  cp .env.example .env   puis   docker compose up --build
#  Dév local : seul postgres est nécessaire ->  docker compose up -d postgres
# =============================================================================

services:
  # ── Base de données PostgreSQL 17 + extension pgvector ─────────────────────
  # Image officielle pgvector : l'extension est disponible dès maintenant,
  # ce qui évite une migration d'infrastructure lors de la phase IA.
  postgres:
    image: pgvector/pgvector:pg17
    container_name: smart-ticketing-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-smart_ticketing}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smart_ticketing}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── LLM local (module IA, Epic 4) — génération & inférence sans coût API ────
  # Open-source, auto-hébergé (conforme CDC §10) ; aucune donnée ne sort de la
  # machine. Modèles à récupérer une fois : `docker exec smart-ticketing-ollama
  # ollama pull qwen2.5:14b` (fallback : qwen2.5:7b).
  ollama:
    image: ollama/ollama:latest
    container_name: smart-ticketing-ollama
    restart: unless-stopped
    # LLM local de la pile — démarré PAR DÉFAUT. La stack doit être autonome et
    # livrable : `docker compose up` doit suffire sur un serveur nu, sans aucune
    # installation préalable. S'adresser à un Ollama de la machine hôte
    # (host.docker.internal) n'est PAS une option de livraison — ce nom ne résout
    # pas sur un serveur Linux sans `extra_hosts: host-gateway`, et la pile
    # échouerait donc silencieusement là où elle est censée être déployée.
    # PAS de `ports:` — volontairement. Publier 11434 alors qu'un Ollama natif
    # écoute déjà dessus ne produit AUCUNE erreur Docker : la liaison est
    # silencieusement masquée par le processus natif. On obtenait alors un
    # `curl localhost:11434` rassurant (les modèles de l'hôte) pendant que
    # `ml -> http://ollama:11434` tombait en « model not found » (404) sur un
    # conteneur vide. Seul `ml` a besoin d'Ollama, et il l'atteint par le réseau
    # interne : la publication n'apportait rien et créait l'ambiguïté.
    environment:
      # Garde le modèle résident entre deux requêtes. Sans ça, Ollama le décharge
      # au bout de 5 min et la requête suivante repaie le chargement — mesuré :
      # 83,0 s à froid contre 62,8 s à chaud pour un même /suggest. Le
      # provisionnement charge déjà le modèle au démarrage de la pile ; ce réglage
      # fait que ce chargement ne se produit qu'UNE fois.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    volumes:
      - ollama-data:/root/.ollama
    # Sans healthcheck, `depends_on: ollama` ne garantit RIEN : le conteneur est
    # « démarré » avant que le serveur n'accepte des requêtes, et les premiers
    # /suggest ou /summarize échouent juste après un `up` — précisément le genre
    # d'incident qui survient en démonstration. `ollama list` interroge le serveur
    # local : il ne rend 0 que lorsque celui-ci répond vraiment.
    # NB : cela ne dit rien des MODÈLES — un serveur sain mais vide répond 404
    # « model not found ». C'est le rôle du service `ollama-prefetch` ci-dessous,
    # dont la sortie en code 0 est la VRAIE garantie de disponibilité des modèles.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Provisionnement des modèles LLM (one-shot) ─────────────────────────────
  # Tire qwen2.5:14b + 7b dans le volume `ollama-data` puis SORT. Ne se contente
  # pas de télécharger : il VÉRIFIE (présence via /api/show, puis une génération
  # d'UN jeton sur le modèle principal). Un blob corrompu ou un modèle manquant
  # fait donc échouer le DÉMARRAGE de la pile, pas la démonstration.
  # Idempotent : ~2 s sur un volume déjà peuplé. Premier démarrage : ~13 Go, la
  # progression est journalisée tous les 10 %.
  # Bâti sur l'image du service IA (et non sur `ollama/ollama`, qui ne contient
  # ni python ni curl et ne permet donc aucune vérification par l'API).
  ollama-prefetch:
    build: ./ml
    image: smart-ticketing-ia:latest
    container_name: smart-ticketing-ollama-prefetch
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODELES: ${OLLAMA_MODELES:-qwen2.5:7b qwen2.5:14b}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    command: ["python", "-m", "smart_ticketing_ml.service.ollama_prefetch"]

  # ── API backend (Express + Prisma) ──────────────────────────────────────────
  backend:
    build: ./backend
    container_name: smart-ticketing-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # PAS de dépendance à `ml`, volontairement : l'IA est un enrichissement NON
      # BLOQUANT (env.ts) et `ml` attend lui-même le préchargement des 4,3 Go de
      # modèles. Faire attendre le backend immobiliserait toute la pile au premier
      # démarrage, pour un service dont l'absence est déjà gérée en dégradé.
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-smart_ticketing}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant — définis-le dans .env}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Smart Ticketing <no-reply@metavoria.tn>}

      # ── Module IA (Epic 4) ────────────────────────────────────────────────
      # SANS SERVICE_IA_URL, le défaut de env.ts est http://127.0.0.1:8000 : le
      # backend dockerisé s'appellerait LUI-MÊME et toute la greffe IA serait
      # morte, silencieusement (l'IA est non bloquante — aucune erreur visible).
      SERVICE_IA_URL: http://ml:8000
      IA_ACTIVE: ${IA_ACTIVE:-true}
      IA_TIMEOUT_MS: ${IA_TIMEOUT_MS:-4000}
      IA_SUGGESTION_TIMEOUT_MS: ${IA_SUGGESTION_TIMEOUT_MS:-60000}
      IA_EXTRACT_TIMEOUT_MS: ${IA_EXTRACT_TIMEOUT_MS:-60000}
      IA_REENTRAINEMENT_TIMEOUT_MS: ${IA_REENTRAINEMENT_TIMEOUT_MS:-30000}
      SEUIL_EXEMPLES_APPRENABLE: ${SEUIL_EXEMPLES_APPRENABLE:-10}

      # ── Sessions à jetons courts (durcissement sécurité) ──────────────────
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}

      # ── Pièces jointes (J8bis lot A) ──────────────────────────────────────
      # Absentes, l'application démarre mais l'upload est DÉSACTIVÉ — donc aucune
      # pièce jointe à faire passer à l'OCR (/extract), et le lot B reste inerte.
      # Amorçage de l'administrateur initial (sans effet si un admin existe déjà).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    # Migrations, PUIS seed, PUIS l'API. Le seed est idempotent (upsert sur les
    # catégories, amorçage de l'admin seulement si aucun n'existe) : le rejouer à
    # chaque démarrage est sans effet de bord. Sans lui, un déploiement neuf
    # démarre avec ZÉRO catégorie — application inutilisable alors que tous les
    # services sont « healthy ». Le `&&` est délibéré : un seed en échec empêche
    # le serveur de démarrer plutôt que de servir une base incomplète.
    command: sh -c "npx prisma migrate deploy && node dist/seed.js && node dist/server.js"

  # ── Service IA (Epic 4) — microservice FastAPI Python ──────────────────────
  # Frontière §3.1 : Node envoie du TEXTE, reçoit du JSON. Le service ne touche
  # JAMAIS la base en écriture (Node est seul à écrire) ; il la LIT pour le RAG.
  ml:
    build: ./ml
    image: smart-ticketing-ia:latest
    container_name: smart-ticketing-ia
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      # Les modèles doivent être en cache AVANT le démarrage : sans ça, le premier
      # /classify déclencherait un téléchargement de 4,3 Go au milieu d'une démo.
      ml-prefetch:
        condition: service_completed_successfully
      # Le serveur LLM doit répondre...
      ollama:
        condition: service_healthy
      # ...ET détenir réellement les modèles. Le healthcheck d'Ollama ne prouve que
      # le premier point ; c'est la sortie en code 0 du provisionnement qui prouve
      # le second. Sans cette dépendance, /suggest et /summarize échoueraient en
      # « model not found » juste après un `up`, sur une pile pourtant « saine ».
      ollama-prefetch:
        condition: service_completed_successfully
    environment:
      # Lecture des catégories + KB du RAG. `db.py` retire le `?schema=` propre à
      # Prisma, inconnu de libpq — l'URL peut donc être identique à celle du backend.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-smart_ticketing}
      OLLAMA_HOST: ${ML_OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_MODEL_FALLBACK: ${OLLAMA_MODEL_FALLBACK:-qwen2.5:7b}
      # `cuda` en production si l'embed à la volée devient trop lent (Phase 7 :
      # changer d'hôte/de device ne change AUCUNE ligne de code applicatif).
      EMBED_DEVICE: ${EMBED_DEVICE:-cpu}
      RERANK_DEVICE: ${RERANK_DEVICE:-cpu}
      OCR_LANGUE: ${OCR_LANGUE:-fra}
      # Charge bge-m3 + le classifieur dès le démarrage : sans ça, le tout premier
      # ticket créé après un `up` dépasserait le budget de 4 s du backend et
      # perdrait son enrichissement IA.
      IA_WARMUP: "true"
    volumes:
      # Bind-mount (et non volume nommé) : le classifieur figé J5 est servi
      # directement depuis le dépôt, et les candidats écrits par /reentrainer sont
      # inspectables côté hôte — transparence exigée par le mémoire.
      - ./ml/artifacts:/app/artifacts
      - hf-cache:/cache/huggingface
    ports:
      - "${ML_PORT:-8000}:8000"

  # ── Préchargement des modèles (one-shot) ───────────────────────────────────
  # Peuple `hf-cache` puis SORT. Seul moment de la vie de la pile où un accès
  # réseau est attendu ; ensuite le service charge ses modèles hors-ligne
  # (cf. service/config.py:source_modele). Idempotent : quelques secondes si le
  # cache est déjà peuplé. Ne se contente pas de télécharger — il CHARGE les deux
  # modèles, donc un cache corrompu échoue ici et non en pleine démonstration.
  ml-prefetch:
    build: ./ml
    image: smart-ticketing-ia:latest
    container_name: smart-ticketing-ia-prefetch
    restart: "no"
    command: ["python", "-m", "smart_ticketing_ml.service.prefetch"]
    volumes:
      - hf-cache:/cache/huggingface

  # ── Frontend (React buildé, servi par nginx qui proxifie /api) ─────────────
  frontend:
    build: ./frontend
    container_name: smart-ticketing-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  postgres-data:
  ollama-data:
  # Modèles Hugging Face (bge-m3 + reranker, ~4,3 Go) : hors de l'image pour
  # la garder légère, et conservés d'un rebuild à l'autre.
  hf-cache:

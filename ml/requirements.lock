# =============================================================================
#  Service IA (Epic 4) — versions FIGÉES de l'environnement Python.
#
#  POURQUOI UN LOCK, ET PAS LES BORNES `>=` DE pyproject.toml
#  ----------------------------------------------------------
#  1. CONTRAINTE DURE — le classifieur figé J5
#     (`artifacts/models/classifier_20260718T204355Z.joblib`) est sérialisé avec
#     scikit-learn 1.4.0. `pyproject.toml` déclare `scikit-learn>=1.4` : une
#     résolution libre installerait aujourd'hui sklearn 1.7.x, et le dépicklage
#     échouerait ou partirait en InconsistentVersionWarning → `/classify` en 503,
#     c'est-à-dire le module IA hors service. Les versions de numpy/scipy/joblib
#     participent au même pickle et sont figées pour la même raison.
#  2. REPRODUCTIBILITÉ DES MESURES — les chiffres du journal (J5 macro-F1 réel
#     0.438, J6 latences reranker, J7 scorecard) ont été obtenus sur ces versions
#     exactes. Les refaire tourner dans l'image doit redonner les mêmes.
#  3. FIDÉLITÉ DU CADRE HTTP — fastapi/starlette/httpx/pytest sont alignés sur
#     l'environnement de développement validé. Une résolution libre remontait
#     starlette 0.36 -> 1.6 (majeure) et huggingface-hub 0.23 -> 0.36, deux sauts
#     qui changent le comportement de FastAPI et le chargement de bge-m3.
#
#  RÉGÉNÉRATION (à ne faire qu'en connaissance de cause) : résoudre dans un
#  conteneur `python:3.12-slim` (PAS depuis un venv Windows — les wheels
#  diffèrent), puis `pip freeze`. Toute montée de scikit-learn impose de
#  RÉENTRAÎNER le classifieur, pas seulement de rebâtir l'image.
#
#  Vérifié à la résolution : `pip check` -> aucun conflit ; 0 paquet nvidia/cuda.
# =============================================================================

# torch en build CPU : le `+cpu` n'existe que sur l'index PyTorch. Sans lui, pip
# tire la build CUDA et ~3 Go de wheels nvidia-* inutiles (le service tourne en
# CPU — cf. EMBED_DEVICE/RERANK_DEVICE dans service/config.py).
--index-url https://pypi.org/simple
--extra-index-url https://download.pytorch.org/whl/cpu

